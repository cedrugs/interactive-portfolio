server {
	listen 3000;
	server_name _;
	server_tokens off;
	root /usr/share/nginx/html;
	index index.html;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
	add_header Cache-Control "no-cache" always;
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
	location = /version.json {
		expires -1;
		try_files $uri =404;
	}
	location = /legacy {
		try_files /index.html =404;
	}
	location / {
		try_files $uri $uri/ =404;
	}
}
