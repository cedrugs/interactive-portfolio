geo $remote_addr $cloudflare_peer {
	default 0;
	173.245.48.0/20 1;
	103.21.244.0/22 1;
	103.22.200.0/22 1;
	103.31.4.0/22 1;
	141.101.64.0/18 1;
	108.162.192.0/18 1;
	190.93.240.0/20 1;
	188.114.96.0/20 1;
	197.234.240.0/22 1;
	198.41.128.0/17 1;
	162.158.0.0/15 1;
	104.16.0.0/13 1;
	104.24.0.0/14 1;
	172.64.0.0/13 1;
	131.0.72.0/22 1;
	2400:cb00::/32 1;
	2606:4700::/32 1;
	2803:f800::/32 1;
	2405:b500::/32 1;
	2405:8100::/32 1;
	2a06:98c0::/29 1;
	2c0f:f248::/32 1;
}
map $http_cf_connecting_ip $cloudflare_client {
	"" $remote_addr;
	default $http_cf_connecting_ip;
}
map $cloudflare_peer $client_ip {
	default $remote_addr;
	1 $cloudflare_client;
}
log_format portfolio escape=json '{"client_ip":"$client_ip","peer_ip":"$realip_remote_addr","request":"$request","status":$status}';
map $uri $asset_cache {
	default "no-store";
	~^/media/[a-f0-9]+/ "public, max-age=31536000, immutable";
	~^/assets/[^/]+-[A-Za-z0-9_-]+\.(js|css|woff2?)$ "public, max-age=31536000, immutable";
	~^/(favicon\.(ico|png)|apple-touch-icon\.png|icon-(192|512)\.png|social-card\.jpg)$ "public, max-age=86400, must-revalidate";
}
map $status $response_cache {
	default $asset_cache;
	~^[45] "no-store";
}
map $uri $robots_policy {
	default "index, follow";
	~^/(legacy|healthz|version\.json|404\.html) "noindex, follow";
}
server {
	set_real_ip_from 10.10.1.3;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;
	access_log /dev/stdout portfolio;
	listen 3000;
	server_name _;
	server_tokens off;
	root /usr/share/nginx/html;
	index index.html;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header X-Robots-Tag $robots_policy always;
	add_header Cache-Control $response_cache always;
	add_header CDN-Cache-Control $response_cache always;
	add_header Cloudflare-CDN-Cache-Control $response_cache always;
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml;
	etag on;
	error_page 404 /404.html;
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
	location = /version.json {
		try_files $uri =404;
	}
	location = /index.html { return 308 /$is_args$args; }
	location ~ ^/(projects|about|stack|contact|legacy)/(?:index\.html)?$ { return 308 /$1$is_args$args; }
	location ~ ^/(projects|about|stack|contact|legacy)$ {
		try_files $uri/index.html =404;
	}
	location = / {
		try_files /index.html =404;
	}
	location = /404.html {
		internal;
	}
	location / {
		try_files $uri =404;
	}
}
