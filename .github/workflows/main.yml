name: Publish portfolio image

on:
  push:
    branches: [staging]
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image-tag: ${{ steps.release.outputs.image-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate release source
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git merge-base --is-ancestor HEAD origin/main
            printf 'image-tag=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            test "$REF_NAME" = staging
            printf 'image-tag=staging\n' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check registry configuration
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          test -n "$REGISTRY_URL"
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/projects/interactive-portfolio:sha-${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/projects/interactive-portfolio:${{ needs.release.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published revision
        env:
          REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '### Published image\n\nRevision: %s\n\nDigest: %s\n\nPublishing does not deploy to SGP-01. Server rollout is not configured yet.\n' "$REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
