name: Deploy portfolio

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate release source
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main

  validate:
    needs: release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://samuelcedric.com
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: teleport-actions/setup@10b5e9f760190f027a1e04e342178d8d6e7eae30
        with:
          version: 18.11.1
      - uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1
        with:
          proxy: gate.tensorcode.co.id:443
          token: sams-valley-github-production
          certificate-ttl: 30m
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer and activate verified image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="$RELEASE_IMAGE@$DIGEST"
          docker pull "$image"
          docker tag "$image" "portfolio-release:$REVISION"
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          docker save "portfolio-release:$REVISION" | gzip -1 | tsh ssh portfolio-deploy@sgp-01 "deploy $REVISION $image_id $DIGEST"
      - name: Verify public revision
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 60); do
            actual=$(curl -fsS --connect-timeout 5 --max-time 10 "https://samuelcedric.com/version.json?deployment=$REVISION" | jq -r '.revision' || true)
            if [ "$actual" = "$REVISION" ]; then
              curl -fsS --max-time 10 https://samuelcedric.com/healthz
              curl -fsSI --max-time 10 https://samuelcedric.com/CV_Samuel_Cedric.pdf
              printf '### Deployment verified\n\nURL: https://samuelcedric.com\n\nRevision: %s\n\nDigest: %s\n' "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          printf 'Public site did not return the deployed revision. Check DNS and Cloudflare cache.\n' >&2
          exit 1
