name: Validate portfolio

on:
  workflow_call:
  push:
    branches: ['**']
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate deployment definitions
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 .github/workflows/ci.yml .github/workflows/main.yml
          docker run --rm --entrypoint shellcheck -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 deploy/install.sh deploy/portfolio-shell deploy/deploy-portfolio
      - name: Build production container
        env:
          REVISION: ${{ github.sha }}
        run: docker build --build-arg "APP_REVISION=$REVISION" --tag portfolio-check .
      - name: Verify production container
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name portfolio-check --user 101:101 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:3000:3000 portfolio-check
          trap 'docker logs portfolio-check; docker rm -f portfolio-check' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/healthz
          test "$(curl -fsS http://127.0.0.1:3000/version.json | jq -r .revision)" = "$REVISION"
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>.*Valley'
          node --experimental-strip-types scripts/verify-site.mjs http://127.0.0.1:3000
          curl -fsSI http://127.0.0.1:3000/assets/workshop-lab/sams-valley-logo.png
          curl -fsSI http://127.0.0.1:3000/CV_Samuel_Cedric.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing.png)" = 404
